name: Build and Release

# ─────────────────────────────────────────────────────────────────────────────
#  Triggers
#  - Automatic on every push to master/main (skip pure-doc / config changes)
#  - Manual via Actions tab, with an optional release-notes field
# ─────────────────────────────────────────────────────────────────────────────
on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Extra release notes (appended to the changelog)'
        required: false
        default: ''
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '**.md'
      - '**.yml'
      - '.gitignore'
      - 'LICENSE'
      - '_config.yml'
      - '_includes/**'

permissions:
  contents: write   # needed to create releases and push tags

# ─────────────────────────────────────────────────────────────────────────────
#  Shared constants
# ─────────────────────────────────────────────────────────────────────────────
env:
  DOTNET_VERSION: '8.0.x'
  MAIN_PROJECT:   'HTML2EXE 2.0'
  # Native C++ webview project directory
  CPP_WV_DIR:     'HTML2EXE_Native_Webview'
  # WebView2 NuGet package (provides headers + WebView2Loader.dll.lib)
  WV2_PKG:        'Microsoft.Web.WebView2'
  WV2_VERSION:    '1.0.2849.39'

# =============================================================================
#  JOB 1 - BUILD
#  Compiles all three release variants of the compiler + native C++ WebView.
# =============================================================================
jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    # -- Source ----------------------------------------------------------------
    - name: Checkout repository
      uses: actions/checkout@v4

    # -- Tooling ---------------------------------------------------------------
    - name: Set up .NET ${{ env.DOTNET_VERSION }}
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Install MinGW-w64 cross-compiler
      run: sudo apt-get install -y mingw-w64

    - name: Download rcedit (Windows PE icon editor)
      run: |
        curl -fsSL \
          https://github.com/electron/rcedit/releases/latest/download/rcedit-x64.exe \
          -o "${{ github.workspace }}/HTML2EXE 2.0/tools/rcedit.exe"

    # -- Version & URL injection -----------------------------------------------
    # Replace REPO_PLACEHOLDER with the actual "owner/repo" of this fork so
    # that auto-update checks, webview downloads, and latest.json all point
    # to this repository's own releases (not the original upstream repo).
    - name: Inject repository name into source URLs
      run: |
        REPO="${{ github.repository }}"
        sed -i "s|REPO_PLACEHOLDER|${REPO}|g" \
          "${{ github.workspace }}/HTML2EXE 2.0/HTML2EXE.cs"

    - name: Inject build version number (run_number -> CurrentVersion)
      run: |
        sed -i \
          "s/CurrentVersion = [0-9]*;/CurrentVersion = ${{ github.run_number }};/" \
          "${{ github.workspace }}/HTML2EXE 2.0/HTML2EXE.cs"

    # -- Restore ---------------------------------------------------------------
    - name: Restore NuGet dependencies
      run: dotnet restore -p:EnableWindowsTargeting=true

    # -- Download WebView2 SDK (NuGet) for native C++ build --------------------
    - name: Download WebView2 NuGet package
      run: |
        mkdir -p webview2-sdk
        curl -fsSL \
          "https://www.nuget.org/api/v2/package/${{ env.WV2_PKG }}/${{ env.WV2_VERSION }}" \
          -o webview2-nupkg.zip
        unzip -q webview2-nupkg.zip -d webview2-sdk
        cp "${{ github.workspace }}/${{ env.CPP_WV_DIR }}/EventToken.h" \
           webview2-sdk/build/native/include/EventToken.h
        echo "WebView2 SDK extracted and EventToken.h installed:"
        ls webview2-sdk/build/native/include/ | head -6

    # -- Build: Native C++ WebView Host ----------------------------------------
    - name: Build native C++ Webview.exe (zero .NET)
      run: |
        cd "${{ env.CPP_WV_DIR }}"
        make \
          CC=x86_64-w64-mingw32-g++ \
          RC=x86_64-w64-mingw32-windres \
          WV2_SDK="${{ github.workspace }}/webview2-sdk"
        ls -lh Webview.exe

    - name: Copy WebView2Loader.dll alongside Webview.exe
      run: |
        cp webview2-sdk/build/native/x64/WebView2Loader.dll \
           "${{ env.CPP_WV_DIR }}/WebView2Loader.dll"

    # -- Package webview zips (same layout as before, one zip for all variants)
    #    The native binary has zero .NET, so one zip covers all use cases.
    - name: Package webview.zip (native C++)
      run: |
        cd "${{ env.CPP_WV_DIR }}"
        zip ../webview.zip Webview.exe WebView2Loader.dll
        # Alias: webview-big.zip is identical – same binary, no .NET to bundle
        cp ../webview.zip ../webview-big.zip
        cd ..

    # -- Build: HTML2EXE-big (self-contained, includes .NET runtime) -----------
    - name: Build HTML2EXE-big.exe [self-contained]
      run: |
        dotnet publish "${{ env.MAIN_PROJECT }}" \
          -c Release -r win-x64 \
          -p:PublishSingleFile=true \
          -p:InvariantGlobalization=true \
          -p:EnableWindowsTargeting=true \
          -p:DefineConstants="BIG_BUILD" \
          --self-contained true \
          -o ./publish-big

    - name: Rename to HTML2EXE-big.exe
      run: mv ./publish-big/HTML2EXE.exe ./publish-big/HTML2EXE-big.exe

    # -- Build: HTML2EXE standard (framework-dependent, requires .NET 8) -------
    - name: Build HTML2EXE.exe [framework-dependent]
      run: |
        dotnet publish "${{ env.MAIN_PROJECT }}" \
          -c Release -r win-x64 \
          -p:PublishSingleFile=true \
          -p:EnableWindowsTargeting=true \
          --no-self-contained \
          -o ./publish

    # -- Offline variant: disable auto-update, then rebuild big ----------------
    - name: Disable auto-update flag for offline build
      run: |
        sed -i \
          "s/bool update = true;/bool update = false;/" \
          "${{ github.workspace }}/HTML2EXE 2.0/HTML2EXE.cs"

    - name: Build HTML2EXE-offline.exe [self-contained, no auto-update]
      run: |
        dotnet publish "${{ env.MAIN_PROJECT }}" \
          -c Release -r win-x64 \
          -p:PublishSingleFile=true \
          -p:InvariantGlobalization=true \
          -p:EnableWindowsTargeting=true \
          -p:DefineConstants="BIG_BUILD" \
          --self-contained true \
          -o ./publish-offline

    - name: Rename to HTML2EXE-offline.exe
      run: mv ./publish-offline/HTML2EXE.exe ./publish-offline/HTML2EXE-offline.exe

    # -- Upload artifacts ------------------------------------------------------
    - name: Upload HTML2EXE.exe
      uses: actions/upload-artifact@v4
      with:
        name: HTML2EXE
        path: ./publish/HTML2EXE.exe
        if-no-files-found: error

    - name: Upload HTML2EXE-big.exe
      uses: actions/upload-artifact@v4
      with:
        name: HTML2EXE-big
        path: ./publish-big/HTML2EXE-big.exe
        if-no-files-found: error

    - name: Upload HTML2EXE-offline.exe
      uses: actions/upload-artifact@v4
      with:
        name: HTML2EXE-offline
        path: ./publish-offline/HTML2EXE-offline.exe
        if-no-files-found: error

    - name: Upload webview.zip
      uses: actions/upload-artifact@v4
      with:
        name: webview
        path: ./webview.zip
        if-no-files-found: error

    - name: Upload webview-big.zip
      uses: actions/upload-artifact@v4
      with:
        name: webview-big
        path: ./webview-big.zip
        if-no-files-found: error

    # -- Build summary ---------------------------------------------------------
    - name: Write build summary
      run: |
        echo "## Build ${{ github.run_number }} succeeded" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Artifact | Type |" >> $GITHUB_STEP_SUMMARY
        echo "|---|---|" >> $GITHUB_STEP_SUMMARY
        echo "| HTML2EXE.exe | Framework-dependent (requires .NET 8) |" >> $GITHUB_STEP_SUMMARY
        echo "| HTML2EXE-big.exe | Self-contained (.NET bundled) |" >> $GITHUB_STEP_SUMMARY
        echo "| HTML2EXE-offline.exe | Self-contained, no auto-update |" >> $GITHUB_STEP_SUMMARY
        echo "| webview.zip | Native C++ WebView2 host (~200 KB, zero .NET) |" >> $GITHUB_STEP_SUMMARY
        echo "| webview-big.zip | Same native C++ binary (alias) |" >> $GITHUB_STEP_SUMMARY

# =============================================================================
#  JOB 2 - RELEASE
#  Downloads all build artifacts and publishes a tagged GitHub Release.
# =============================================================================
  release:
    needs: build
    runs-on: ubuntu-latest

    steps:

    # -- Download every artifact from the build job ----------------------------
    - name: Download HTML2EXE.exe
      uses: actions/download-artifact@v4
      with:
        name: HTML2EXE
        path: ./dist/standard

    - name: Download HTML2EXE-big.exe
      uses: actions/download-artifact@v4
      with:
        name: HTML2EXE-big
        path: ./dist/big

    - name: Download HTML2EXE-offline.exe
      uses: actions/download-artifact@v4
      with:
        name: HTML2EXE-offline
        path: ./dist/offline

    - name: Download webview.zip
      uses: actions/download-artifact@v4
      with:
        name: webview
        path: ./dist

    - name: Download webview-big.zip
      uses: actions/download-artifact@v4
      with:
        name: webview-big
        path: ./dist

    # -- Package ZIP files for seamless browser downloads (avoids browser raw EXE blocking)
    - name: Package ZIP distributions
      run: |
        cd ./dist/standard && zip -9 ../HTML2EXE.zip HTML2EXE.exe && cd ../..
        cd ./dist/big && zip -9 ../HTML2EXE-big.zip HTML2EXE-big.exe && cd ../..
        cd ./dist/offline && zip -9 ../HTML2EXE-offline.zip HTML2EXE-offline.exe && cd ../..

    # -- Generate latest.json for the in-app auto-updater ----------------------
    - name: Generate latest.json
      run: |
        REPO="${{ github.repository }}"
        RUN="${{ github.run_number }}"
        printf '{\n  "version": %s,\n  "update": true,\n  "url": "https://github.com/%s/releases/download/%s/HTML2EXE.exe",\n  "url_big": "https://github.com/%s/releases/download/%s/HTML2EXE-big.exe"\n}\n' \
          "$RUN" "$REPO" "$RUN" "$REPO" "$RUN" > ./dist/latest.json
        cat ./dist/latest.json

    # -- Compose release notes -------------------------------------------------
    - name: Compose release notes
      run: |
        REPO="${{ github.repository }}"
        RUN="${{ github.run_number }}"
        {
          printf "## HTML2EXE 2.%s\n\n" "$RUN"
          printf "### 🚀 WebView host: **Native C++ — zero .NET dependency**\n\n"
          printf "| Download | Description |\n"
          printf "|---|---|\n"
          printf "| [**HTML2EXE-big.zip**](https://github.com/%s/releases/download/%s/HTML2EXE-big.zip) ⭐ | **Recommended** (Self-contained, avoids browser warnings) |\n" "$REPO" "$RUN"
          printf "| [**HTML2EXE-big.exe**](https://github.com/%s/releases/download/%s/HTML2EXE-big.exe) | Self-contained executable — no .NET required |\n" "$REPO" "$RUN"
          printf "| [**HTML2EXE.zip**](https://github.com/%s/releases/download/%s/HTML2EXE.zip) | Framework-dependent zip (requires .NET 8) |\n" "$REPO" "$RUN"
          printf "| [**HTML2EXE.exe**](https://github.com/%s/releases/download/%s/HTML2EXE.exe) | Framework-dependent executable |\n" "$REPO" "$RUN"
          printf "| [**HTML2EXE-offline.zip**](https://github.com/%s/releases/download/%s/HTML2EXE-offline.zip) | Offline zip (no auto-update) |\n" "$REPO" "$RUN"
          printf "| webview.zip | Native C++ WebView2 host (~200 KB, **zero .NET**) |\n"
          printf "| webview-big.zip | Same native C++ binary (alias) |\n"
          printf "| latest.json | Auto-update manifest |\n\n"
          printf "### Changes\n"
          printf "> %s\n" "${{ github.event.head_commit.message }}"
          EXTRA="${{ github.event.inputs.release_notes }}"
          [ -n "$EXTRA" ] && printf "> %s\n" "$EXTRA"
        } > release_notes.md
        cat release_notes.md

    # -- Publish GitHub Release ------------------------------------------------
    - name: Create GitHub Release
      uses: ncipollo/release-action@v1
      with:
        name: "HTML2EXE 2.${{ github.run_number }}"
        tag: "${{ github.run_number }}"
        bodyFile: release_notes.md
        token: ${{ secrets.GITHUB_TOKEN }}
        artifacts: |
          ./dist/standard/HTML2EXE.exe
          ./dist/big/HTML2EXE-big.exe
          ./dist/offline/HTML2EXE-offline.exe
          ./dist/HTML2EXE.zip
          ./dist/HTML2EXE-big.zip
          ./dist/HTML2EXE-offline.zip
          ./dist/webview.zip
          ./dist/webview-big.zip
          ./dist/latest.json
        artifactErrorsFailBuild: true
